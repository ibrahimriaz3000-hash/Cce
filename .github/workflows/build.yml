name: Build CCGlass
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.7

      - name: Unzip project
        run: |
          ZIP=$(ls *fixed*.zip 2>/dev/null | head -n1)
          if [ -z "$ZIP" ]; then ZIP=$(ls *.zip | head -n1); fi
          echo "Using zip: $ZIP"
          mkdir -p proj
          unzip -o -q "$ZIP" -d proj
          SG=$(find proj -name settings.gradle | head -n1)
          echo "PROJ_DIR=$(dirname "$SG")" >> "$GITHUB_ENV"

      - name: Build release APK
        working-directory: ${{ env.PROJ_DIR }}
        run: gradle assembleRelease --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: CCGlass-apk
          path: ${{ env.PROJ_DIR }}/app/build/outputs/apk/release/*.apk
